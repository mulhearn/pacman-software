# Our additions to the Trenz petalinuxbsp.conf (appended by the create scripts).

# Uninative 4.4 (glibc 2.39), for build hosts with glibc newer than 2.37 (e.g. Ubuntu 24.04);  :forcevariable
# because yocto-uninative.inc, parsed after this file, sets the version itself.
UNINATIVE_MAXGLIBCVERSION:forcevariable = "2.39"
UNINATIVE_VERSION:forcevariable = "4.4"
UNINATIVE_TARBALL = "${BUILD_ARCH}-nativesdk-libc-4.4.tar.xz"
UNINATIVE_URL = "https://downloads.yoctoproject.org/releases/uninative/4.4/"
UNINATIVE_CHECKSUM[x86_64] = "d81c54284be2bb886931fc87281d58177a2cd381cf99d1981f8923039a72a302"

# Shared cache, read-only:  download premirror and sstate mirror at petalinux/cache (a symlink per host;  none:  no
# effect, the normal sources and feeds are used).
PACMAN_CACHE = "${TOPDIR}/../../cache"
PREMIRRORS:prepend = "\
    git://.*/.*     file://${PACMAN_CACHE}/downloads/ \
    gitsm://.*/.*   file://${PACMAN_CACHE}/downloads/ \
    https?://.*/.*  file://${PACMAN_CACHE}/downloads/ \
    ftp://.*/.*     file://${PACMAN_CACHE}/downloads/ \
"
SSTATE_MIRRORS:prepend = "file://.* file://${PACMAN_CACHE}/sstate/PATH \n"
